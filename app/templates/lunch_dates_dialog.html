<dialog id="lunch-dates" class="ld-dialog" aria-labelledby="ld-title">
  <div class="ld-head"><div><span class="ld-eyebrow">อาหารกลางวัน · วันในงวด</span><h2 id="ld-title">เลือกวันที่จัดอาหาร</h2></div><button type="button" class="ld-close" aria-label="ปิดปฏิทิน">✕</button></div>
  <div id="ld-message" class="ld-note" role="status">กำลังโหลดปฏิทิน…</div>
