<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy Ekkasan | คอนโซลผู้ดูแลระบบ</title>
  <link rel="icon" type="image/png" href="/static/favicon-ekkasan.png">
  <style>
    @font-face { font-family:"Prompt"; font-weight:400; src:url("/static/fonts/Prompt-Regular.ttf") format("truetype"); }
    @font-face { font-family:"Prompt"; font-weight:700; src:url("/static/fonts/Prompt-Bold.ttf") format("truetype"); }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:"Prompt","Sarabun","Segoe UI",sans-serif; background:#F5F6FA; color:#202224; padding:20px; }
    .card { background:#fff; max-width:480px; border-radius:18px; padding:34px 30px; text-align:center;
      box-shadow:0 12px 34px rgba(16,24,40,.12); border:1px solid #eceef3; }
    .ic { width:64px; height:64px; border-radius:50%; background:#e8f0ff; color:#2563eb; display:flex;
      align-items:center; justify-content:center; margin:0 auto 16px; }
    .ic svg { width:32px; height:32px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:#5a6a85; line-height:1.7; margin:0; }
    .btn { display:inline-block; margin-top:20px; background:#2563eb; color:#fff; text-decoration:none;
      padding:11px 24px; border-radius:11px; font-weight:700; }
    .btn.gray { background:#eef0f4; color:#5a6a85; margin-left:6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>หน้านี้สำหรับผู้ดูแลระบบ</h1>
    <p>คอนโซลอนุมัติคำสั่งซื้อเปิดได้เฉพาะ<b>บัญชีผู้ดูแลระบบ (ผู้ขาย)</b><br>
       ขณะนี้คุณกำลังใช้บัญชีโรงเรียนอยู่ — โปรดออกจากระบบแล้วเข้าใหม่ด้วยบัญชีผู้ดูแลระบบ</p>
    <div>
      <a class="btn" href="/logout">ออกจากระบบเพื่อเข้าบัญชีผู้ดูแล</a>
      <a class="btn gray" href="/">กลับหน้าหลัก</a>
    </div>
  </div>
</body>
</html>
