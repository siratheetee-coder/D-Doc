<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy Ekkasan | ไม่มีสิทธิ์ใช้งาน</title>
  <link rel="icon" type="image/png" href="/static/favicon-ekkasan.png">
  <style>
    @font-face { font-family:"Prompt"; font-weight:400; src:url("/static/fonts/Prompt-Regular.ttf") format("truetype"); }
    @font-face { font-family:"Prompt"; font-weight:700; src:url("/static/fonts/Prompt-Bold.ttf") format("truetype"); }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:"Prompt","Sarabun","Segoe UI",sans-serif; background:#F5F6FA; color:#202224; padding:20px; }
    .card { background:#fff; max-width:460px; border-radius:18px; padding:34px 30px; text-align:center;
      box-shadow:0 12px 34px rgba(16,24,40,.12); border:1px solid #eceef3; }
    .ic { width:64px; height:64px; border-radius:50%; background:#fff1f1; color:#dc2626; display:flex;
      align-items:center; justify-content:center; margin:0 auto 16px; }
    .ic svg { width:32px; height:32px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:#5a6a85; line-height:1.7; margin:0; }
    .btn { display:inline-block; margin-top:20px; background:#4880FF; color:#fff; text-decoration:none;
      padding:11px 22px; border-radius:11px; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>บัญชีนี้ไม่มีสิทธิ์ใช้{{ module_label }}</h1>
    <p>งานนี้ยังไม่ได้เปิดสิทธิ์ให้บัญชีของคุณ<br>
       หากต้องการเข้าใช้ โปรดติดต่อ<b>ผู้ดูแลหลักของโรงเรียน</b> (ไอดีหลัก)<br>
       ให้เปิดสิทธิ์งานนี้ให้ผ่านเมนู "จัดการผู้ใช้"</p>
    <a class="btn" href="/">กลับหน้าเลือกงาน</a>
  </div>
</body>
</html>
