{# กล่องบันทึกคะแนนความประพฤติ ใช้ร่วมกันหน้ารายห้องและหน้ารายคน · window.bhOpen(ids, names) #}
<dialog id="bhDlg" class="bh-dlg">
  <form method="post" action="/general/behavior/add" id="bhForm">
    <input type="hidden" name="student_ids" id="bhIds">
    <input type="hidden" name="back" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query|replace('msg=', 'x=') }}{% endif %}">
    <input type="hidden" name="rule_id" id="bhRule" value="0">
    <div class="bh-dh"><h2>บันทึกคะแนนความประพฤติ</h2><button type="button" class="bh-x" data-close aria-label="ปิด">✕</button></div>
    <div class="bh-db">
      <div class="bh-who" id="bhWho"></div>
      <div class="bh-kind" role="tablist">
        <button type="button" data-kind="minus" class="on">หักคะแนน</button>
        <button type="button" data-kind="plus">เพิ่มคะแนน / ซ่อม</button>
      </div>
      <input type="hidden" name="kind" id="bhKind" value="minus">
      <div class="bh-rules">
        {% for r in rules %}<button type="button" class="bh-rule" data-kind="{{ r.kind }}" data-id="{{ r.id }}"{% if r.kind == 'plus' %} hidden{% endif %}>{{ r.name }}<b>{{ '+' if r.kind == 'plus' else '-' }}{{ r.points }}</b></button>{% endfor %}
        <button type="button" class="bh-rule other" data-id="0">อื่น ๆ (พิมพ์เอง)</button>
      </div>
      <div class="bh-other" id="bhOther" hidden>
        <input name="label" placeholder="ชื่อรายการ" maxlength="200">
        <input name="points" placeholder="คะแนน" inputmode="numeric" style="max-width:110px">
      </div>
      <div class="bh-row2">
        <div><label>วันที่</label><input name="date" data-date="1" value="{{ today_input }}" inputmode="numeric" maxlength="10"></div>
        <div><label>หมายเหตุ (ถ้ามี)</label><input name="note" maxlength="500" placeholder="เช่น สถานที่ หรือรายละเอียด"></div>
      </div>
    </div>
    <div class="bh-df"><button type="button" class="ap-btn ap-soft" data-close>ยกเลิก</button><button class="ap-btn ap-main" type="submit" id="bhSave" data-no-floating-save disabled>บันทึก</button></div>
  </form>
</dialog>
<style>
.bh-dlg{border:0;border-radius:20px;padding:0;width:min(560px,calc(100vw - 20px));box-shadow:0 24px 70px rgba(30,20,80,.3)}
.bh-dlg::backdrop{background:rgba(15,10,40,.4)}
.bh-dlg form{margin:0}
.bh-dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.bh-dh h2{margin:0!important;font-size:18px;background:none!important;padding:0!important;border:0!important}
.bh-x{border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;cursor:pointer}
.bh-db{padding:6px 18px 10px}
.bh-who{font-weight:600;color:#4338ca;margin-bottom:10px;font-size:14px}
.bh-kind{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#f1f5f9;margin-bottom:10px}
.bh-kind button{border:0;background:none;border-radius:9px;padding:7px 14px;font:inherit;font-weight:600;color:#475569;cursor:pointer}
.bh-kind button.on[data-kind=minus]{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff}
.bh-kind button.on[data-kind=plus]{background:linear-gradient(135deg,#4ade80,#059669);color:#fff}
.bh-rules{display:flex;flex-wrap:wrap;gap:6px}
.bh-rule{border:0;border-radius:11px;padding:8px 12px;font:inherit;font-size:13.5px;background:#f8fafc;box-shadow:inset 0 0 0 1px #e2e8f0;cursor:pointer;color:#334155}
.bh-rule b{margin-left:6px;color:#dc2626}.bh-rule[data-kind=plus] b{color:#059669}
.bh-rule.on{background:linear-gradient(135deg,#eef2ff,#e0e7ff);box-shadow:inset 0 0 0 2px #6366f1}
.bh-other{display:flex;gap:8px;margin-top:8px}
.bh-row2{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:12px}
.bh-row2 label{font-size:13px;color:#64748b}
.bh-df{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
@media(max-width:520px){.bh-row2{grid-template-columns:1fr}}
</style>
<script>
(function(){
  var dlg = document.getElementById('bhDlg'); if (!dlg) return;
  var kind = 'minus', save = document.getElementById('bhSave');
  function ok(){
    var r = document.querySelector('.bh-rule.on');
    var other = r && r.dataset.id === '0';
    save.disabled = !r || (other && !(document.querySelector('[name=label]').value.trim() && document.querySelector('[name=points]').value.trim()));
  }
  function setKind(k){
    kind = k; document.getElementById('bhKind').value = k;
    dlg.querySelectorAll('.bh-kind button').forEach(function(b){ b.classList.toggle('on', b.dataset.kind === k); });
    dlg.querySelectorAll('.bh-rule[data-kind]').forEach(function(b){ b.hidden = b.dataset.kind !== k; b.classList.remove('on'); });
    document.getElementById('bhRule').value = '0'; document.getElementById('bhOther').hidden = true;
    dlg.querySelector('.bh-rule.other').classList.remove('on'); ok();
  }
  dlg.querySelectorAll('.bh-kind button').forEach(function(b){ b.addEventListener('click', function(){ setKind(b.dataset.kind); }); });
  dlg.querySelectorAll('.bh-rule').forEach(function(b){
    b.addEventListener('click', function(){
      dlg.querySelectorAll('.bh-rule').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); document.getElementById('bhRule').value = b.dataset.id;
      document.getElementById('bhOther').hidden = b.dataset.id !== '0'; ok();
    });
  });
  dlg.addEventListener('input', ok);
  dlg.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ dlg.close(); }); });
  document.getElementById('bhForm').addEventListener('submit', function(){ save.disabled = true; save.textContent = 'กำลังบันทึก...'; });
  window.bhOpen = function(ids, names){
    document.getElementById('bhIds').value = ids.join(',');
    document.getElementById('bhWho').textContent = names.length > 3 ? names.slice(0, 3).join(', ') + ' และอีก ' + (names.length - 3) + ' คน' : names.join(', ');
    setKind('minus'); dlg.showModal();
  };
})();
</script>
