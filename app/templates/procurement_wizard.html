{% extends "base.html" %}
{% block title %}ตัวช่วยจัดซื้อจัดจ้าง{% endblock %}
{% block content %}
<style>
  .wz-trail { display:flex; flex-direction:column; gap:6px; margin:0 0 14px; }
  .wz-trail .done { font-size:14px; color:var(--muted); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .wz-trail .done b { color:var(--text); font-weight:600; }
  .wz-trail .done button { background:none; border:0; color:var(--brand); cursor:pointer; font-size:13px; padding:0; }
  .wz-q { font-size:19px; font-weight:700; margin:0 0 6px; line-height:1.5; }
  .wz-help { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .wz-opts { display:flex; flex-direction:column; gap:10px; }
  .wz-opt { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; font-size:16px; cursor:pointer; line-height:1.5; font-family:inherit; color:var(--text); }
  .wz-opt:hover { border-color:var(--brand); box-shadow:0 6px 16px rgba(72,128,255,.14); }
  .wz-opt small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .wz-list { columns:2; column-gap:24px; margin:0 0 14px; padding-left:20px; font-size:14px; color:var(--muted); }
  @media (max-width:700px){ .wz-list { columns:1; } }
  .wz-result h2 { margin:0 0 8px; }
  .wz-badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700;
    background:#fef3c7; color:#92400e; margin-bottom:8px; }
  .wz-refs { font-size:14px; color:var(--muted); margin:10px 0 0; padding-left:20px; }
</style>

<div class="card">
  <h1 style="margin:0;"><svg class="icon"><use href="#ic-clipboard"/></svg> ตัวช่วยจัดซื้อจัดจ้าง</h1>
  <p class="muted" style="margin:8px 0 0;">ตอบคำถามทีละข้อ ระบบจะแนะนำรูปแบบเอกสารที่ตรงกับเรื่องของคุณ
    พร้อมบอกเหตุผลและระเบียบที่อ้างอิง · <a href="/procurement/new">เลือกรูปแบบเองแทน</a></p>
</div>

<div class="card" id="wz">
  <div class="wz-trail" id="wz-trail"></div>
  <div id="wz-body"></div>
</div>

<script>
(() => {
  const NODES = {{ nodes|tojson }};
  const RESULTS = {{ results|tojson }};
  const CASES = {{ cases|tojson }};
  const trail = document.getElementById('wz-trail');
  const body = document.getElementById('wz-body');
  let history = [];            // [{node, label, value, set}]
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = n => Number(n).toLocaleString('th-TH', {maximumFractionDigits: 2});

  function carried() { return Object.assign({}, ...history.map(h => h.set || {})); }

  function renderTrail() {
    trail.innerHTML = history.map((h, i) =>
      `<div class="done">${i + 1}. ${esc(NODES[h.node].q)} → <b>${esc(h.label)}</b>
        <button type="button" data-back="${i}">แก้คำตอบ</button></div>`).join('');
  }

  function step(nodeId, label, value, s, next) {
    history.push({node: nodeId, label, value, set: s || {}});
    next.result ? showResult(next.result) : showNode(next.next);
  }

  function showNode(id) {
    const n = NODES[id];
    renderTrail();
    let html = `<p class="wz-q">${esc(n.q)}</p>`;
    if (n.help) html += `<p class="wz-help">${esc(n.help)}</p>`;
    if (n.list) html += `<ul class="wz-list">${n.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    if (n.kind === 'amount') {
      html += `<div style="display:flex; gap:8px; flex-wrap:wrap; max-width:460px;">
        <input id="wz-amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="เช่น 35000" style="flex:1;">
        <button type="button" class="btn" id="wz-next">ถัดไป</button></div>
        <p class="wz-help" id="wz-err" style="color:#b91c1c; margin-top:8px;"></p>`;
      body.innerHTML = html;
      const input = document.getElementById('wz-amount');
      const go = () => {
        const v = parseFloat(input.value);
        if (!(v > 0)) { document.getElementById('wz-err').textContent = 'กรุณากรอกวงเงินเป็นตัวเลขมากกว่า 0'; return; }
        const r = n.ranges.find(x => x.max === null || v <= x.max);
        step(id, money(v) + ' บาท', v, {amount: v}, r);
      };
      document.getElementById('wz-next').onclick = go;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      input.focus();
      return;
    }
    html += `<div class="wz-opts">${n.options.map((o, i) =>
      `<button type="button" class="wz-opt" data-i="${i}">${esc(o.label)}${o.help ? `<small>${esc(o.help)}</small>` : ''}</button>`).join('')}</div>`;
    body.innerHTML = html;
    body.querySelectorAll('.wz-opt').forEach(b => b.onclick = () => {
      const o = n.options[+b.dataset.i];
      step(id, o.label, +b.dataset.i, o.set, o);
    });
  }

  function showResult(key) {
    renderTrail();
    const r = RESULTS[key];
    const c = carried();
    let html = `<div class="wz-result">`;
    if (r.dev) html += `<span class="wz-badge">${r.out_of_scope ? 'อยู่นอกขอบเขตระบบ · ' : ''}อยู่ระหว่างการพัฒนา</span>`;
    html += `<p class="muted" style="margin:0;">ระบบแนะนำ</p><h2>${esc(r.title)}</h2>`;
    if (c.amount) html += `<p style="margin:0 0 6px;">วงเงิน <b>${money(c.amount)}</b> บาท${c.proc_type ? ` · งาน<b>${esc(c.proc_type)}</b>` : ''}</p>`;
    html += `<p style="line-height:1.7;">${esc(r.why)}</p>`;
    if (r.warn) html += `<div class="alert warn"><svg class="icon"><use href="#ic-alert"/></svg><div>${esc(r.warn)}</div></div>`;
    if (r.alt) html += `<p class="muted">${esc(r.alt)}</p>`;
    if (r.refs && r.refs.length) html += `<p style="margin:12px 0 0; font-weight:600;">อ้างอิง</p><ul class="wz-refs">${r.refs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    html += `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;">`;
    if (r.go) html += `<a class="btn" href="${esc(r.go)}">${esc(r.go_label)}</a>`;
    if (r.case && !r.out_of_scope) {
      const q = new URLSearchParams({case: r.case, wizard: '1'});
      if (c.proc_type) q.set('proc_type', c.proc_type);
      html += `<a class="btn green" href="/procurement/new?${q}">สร้างเรื่องแบบ ${esc(CASES[r.case])}</a>`;
    }
    html += `<button type="button" class="btn gray" id="wz-restart">เริ่มใหม่</button></div></div>`;
    body.innerHTML = html;
    document.getElementById('wz-restart').onclick = () => { history = []; showNode('start'); };
  }

  trail.addEventListener('click', e => {
    const b = e.target.closest('[data-back]');
    if (!b) return;
    const i = +b.dataset.back;
    const node = history[i].node;
    history = history.slice(0, i);
    showNode(node);
  });

  showNode('start');
})();
</script>
{% endblock %}
