<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นโยบายความเป็นส่วนตัว - Easy Ekkasan</title>
<style>
  @font-face { font-family:"Prompt"; font-weight:400; src:url("/static/fonts/Prompt-Regular.ttf") format("truetype"); }
  @font-face { font-family:"Prompt"; font-weight:600; src:url("/static/fonts/Prompt-SemiBold.ttf") format("truetype"); }
  @font-face { font-family:"Prompt"; font-weight:700; src:url("/static/fonts/Prompt-Bold.ttf") format("truetype"); }
  :root { --ink:#1f2a44; --muted:#5a6a85; --brand:#4880FF; --line:#e6eaf2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Prompt','Segoe UI',system-ui,sans-serif; color:var(--ink);
    background:#f4f6fb; line-height:1.75; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 20px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:30px 34px;
    box-shadow:0 6px 24px rgba(16,24,40,.06); }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }
  h2 { font-size:18px; margin:26px 0 8px; padding-top:8px; border-top:1px solid var(--line); }
  h2:first-of-type { border-top:none; }
  ul { margin:6px 0; padding-left:22px; }
  li { margin:4px 0; }
  a { color:var(--brand); }
  .note { background:#fff8ec; border-left:4px solid #f0a020; border-radius:8px;
    padding:12px 15px; font-size:14px; color:#7a4f06; margin:18px 0; }
  .back { display:inline-block; margin-bottom:16px; color:var(--muted); text-decoration:none; font-size:14px; }
  .fill { color:var(--ink); font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/login">&larr; กลับหน้าเข้าสู่ระบบ</a>
  <div class="card">
    <h1>นโยบายความเป็นส่วนตัว</h1>
    <p class="sub">ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) ปรับปรุงล่าสุด <span class="fill">วันที่ 1 กันยายน 2569</span></p>

    {% include "_privacy_body.html" %}

    <footer>Easy Ekkasan · ระบบจัดการเอกสารสถานศึกษา</footer>
  </div>
</div>
</body>
</html>
