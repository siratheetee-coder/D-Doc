# Include inside the application's server {} block, including its HTTPS block.
# Served directly by nginx: must not depend on the Python service.
proxy_intercept_errors on;
error_page 502 503 504 =503 /_ddoc-unavailable.html;

location = /_ddoc-unavailable.html {
    internal;
    alias /var/www/ddoc-errors/unavailable.html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "120" always;
}

location ^~ /_ddoc-errors/ {
    alias /var/www/ddoc-errors/assets/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
}
